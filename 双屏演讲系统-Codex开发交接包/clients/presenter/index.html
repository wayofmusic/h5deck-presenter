<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f4"><title>双屏演讲 · 手机逐字稿</title><link rel="stylesheet" href="/clients/ui.css"></head><body class="phone"><div class="phone-shell"><header class="phone-header"><div class="row spread"><div class="brand"><span class="brand-icon">↔</span><span id="deck-title">双屏演讲</span></div><span class="pill" id="connection">连接中</span></div><div class="phone-page-info"><strong id="page">— / —</strong><span id="chapter">等待课件</span><span id="step" style="float:right"></span></div></header><div class="disconnect" id="disconnect" role="status" hidden></div>
<section id="pair-empty" class="pair-empty" hidden><div class="eyebrow">YOUR PRESENTER COMPANION</div><h1>把讲稿，放在手边。</h1><p id="pair-message">请扫描电脑设置页上的配对二维码。<br>手机与电脑需要连接同一 Wi-Fi 或热点。</p><button id="retry" style="margin-top:20px">重新连接</button></section>
<div id="reading" hidden><div class="reading-toolbar"><span class="eyebrow">SPEAKER NOTES</span><div class="row"><button id="font-minus" aria-label="缩小讲稿字号">A−</button><button id="font-plus" aria-label="放大讲稿字号">A＋</button><button id="auto-scroll">自动滚动</button></div></div><main class="script-area"><h1 id="slide-title"></h1><aside class="cue"><b>现场提示</b><span id="cue"></span></aside><article class="script-copy" id="script"></article><p class="hint" id="page-duration"></p></main></div>
<footer class="phone-bottom" id="controls" hidden><p class="next-slide">接下来 <b id="next-title"></b></p><div class="phone-nav"><button data-command="PREV_STEP">← 上一步</button><button data-command="NEXT_STEP" class="primary">下一步 →</button></div><div class="secondary-controls"><button id="chapters-open">☷ 目录</button><span class="clock" id="timer">00:00</span><button id="tools-open">演讲工具 ⌃</button></div></footer>
<dialog id="chapters"><div class="dialog-head"><h2>跳转页面</h2><button data-close>关闭</button></div><div id="chapter-list"></div></dialog>
<dialog id="tools"><div class="dialog-head"><h2>演讲工具</h2><button data-close>关闭</button></div><div class="tool-grid"><button data-command="PREV_SLIDE">直接上一页</button><button data-command="NEXT_SLIDE">直接下一页</button><button id="blackout">黑屏</button><button data-command="REPLAY">重播本页</button><button id="timer-toggle">开始计时</button><button data-command="TIMER_RESET">计时归零</button></div><section class="tools-section"><h3>五分钟现场练习 <span id="exercise-clock">05:00</span></h3><div class="tool-grid"><button id="exercise-toggle">开始练习</button><button data-command="EXERCISE_RESET">练习归零</button></div></section><section class="tools-section"><h3>阅读设置</h3><div class="tool-grid"><button id="wake-lock">尝试保持屏幕常亮</button><button id="fullscreen">全屏阅读</button></div><div class="speed"><label for="scroll-speed" style="margin:0">滚动速度</label><input id="scroll-speed" type="range" min="8" max="48" value="20"><span id="speed-label">20 px/s</span></div><p class="hint" style="margin-top:12px">手指滚动会暂停自动滚动。滚动到讲稿末尾不会触发翻页。</p></section></dialog><div id="toast" class="toast" role="status" hidden></div></div><script type="module" src="/clients/presenter/presenter.mjs"></script></body></html>
