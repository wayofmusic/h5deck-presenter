<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>计算器调试练习</title><style>*{box-sizing:border-box}body{font-family:"Microsoft YaHei",sans-serif;background:#f3f0e9;color:#242722;margin:0;padding:28px;line-height:1.65}main{max-width:620px;margin:30px auto;padding:32px;background:#fffdf8;border:1px solid #d7d4ca;border-radius:20px}h1{line-height:1.35;font-size:30px}label{display:block;margin:15px 0 5px}input,select,button{font:inherit;padding:12px;border:1px solid #aaa;border-radius:8px;width:100%}button{cursor:pointer;background:#294f42;color:white;border:0;margin-top:18px;min-height:46px}button.secondary{background:#e9e6de;color:#30332d;margin-top:9px}output{display:block;overflow-wrap:anywhere;min-height:90px;padding:16px;background:#eef2ec;border-radius:9px;margin-top:18px;font-size:30px;font-weight:bold}#message{min-height:26px}small{color:#67695e}body[data-status="error"] #message{color:#a02c23}@media(max-width:480px){body{padding:14px}main{padding:22px;margin:12px auto}h1{font-size:26px}}</style></head><body data-status="idle"><main><h1>计算器调试练习</h1><p>用相同输入重现问题，记下预期和实际结果，再开始排查。</p><form id="calculator"><label for="first">第一个数</label><input id="first" inputmode="decimal" autocomplete="off" value="2"><label for="operator">运算</label><select id="operator"><option value="+">加 ＋</option><option value="-">减 −</option><option value="*">乘 ×</option><option value="/">除 ÷</option></select><label for="second">第二个数</label><input id="second" inputmode="decimal" autocomplete="off" value="3"><button id="calculate" type="submit">计算</button><button id="clear" class="secondary" type="button">清空</button></form><output id="result" aria-live="polite">—</output><p id="message" role="status">请输入两个数。</p></main><script>(()=>{'use strict';const a=document.querySelector('#first'),b=document.querySelector('#second'),op=document.querySelector('#operator'),result=document.querySelector('#result'),message=document.querySelector('#message');document.querySelector('#calculator').onsubmit=e=>{e.preventDefault();const x=a.value,y=b.value;result.textContent=String(op.value==='+'?x+y:op.value==='-'?x-y:op.value==='*'?x*y:x/y);document.body.dataset.status='done';message.textContent='计算完成。';};document.querySelector('#clear').onclick=()=>{a.value='';b.value='';op.value='+';result.textContent='—';message.textContent='请输入两个数。';document.body.dataset.status='idle';a.removeAttribute('aria-invalid');b.removeAttribute('aria-invalid');a.focus()};})();</script></body></html>
